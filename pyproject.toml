[project]
name = "raycast-ai-usage"
version = "0.1.0"
description = "Local AI token usage, estimated costs and account limits in Raycast"
readme = "README.md"
license = "MIT"
authors = [
    { name = "viggo", email = "229558850+viggomeesters@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-usage = "raycast_ai_usage.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
